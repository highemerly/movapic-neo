name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  # 作り直し用。入力はそのままイメージタグと k8s マニフェストの版になる（`v` は外れない）ので、
  # タグ push 時と揃えて `v` を付けずに入れる。既定値は置かない（以前は latest で、そのまま実行すると
  # マニフェストが :latest になり得た）。
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag without "v" (e.g., 1.5.3)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_REPO: highemerly/k8sg1-repo
  # web / worker-front / compute は同一イメージ・同一タグ。3マニフェストを更新する（スペース区切り）。
  K8S_MANIFEST_PATHS: "manifests/movapic-neo/prd/web.yaml manifests/movapic-neo/prd/worker.yaml manifests/movapic-neo/prd/compute.yaml"

jobs:
  # CI（vitest / eslint / tsc）。build-and-push と並走し、両方緑になって初めて
  # create-k8s-pr が走る（下の needs 参照）。定義は checks.yml に集約。
  checks:
    uses: ./.github/workflows/checks.yml

  # ゴールデン画像テスト（skia 実描画の見た目回帰）。build-and-push と並走し、退行があれば
  # create-k8s-pr を止める。定義は golden.yml に集約。
  golden:
    uses: ./.github/workflows/golden.yml
    secrets:
      FONT_REPO_TOKEN: ${{ secrets.FONT_REPO_TOKEN }}

  # E2E スモーク。push したばかりの本番イメージそのもの（＝デプロイするもの）で回す。ブランチの CI は
  # 差分で E2E を省くことがあるので、リリースではここで必ず通してから k8s マニフェストへ PR する。
  e2e:
    needs: build-and-push
    uses: ./.github/workflows/e2e.yml
    with:
      image: ${{ needs.build-and-push.outputs.image }}
    secrets:
      FONT_REPO_TOKEN: ${{ secrets.FONT_REPO_TOKEN }}

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      # E2E が pull するイメージ（metadata-action の {{version}} / workflow_dispatch の tag と同じ値）
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
      # create-k8s-pr が PR 本文（差分のリンク・コミット一覧）に使う。前回のタグが無ければ空
      prev_tag: ${{ steps.migration.outputs.prev_tag }}
      has_migration: ${{ steps.migration.outputs.has_migration }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout fonts (private repository)
        uses: actions/checkout@v7
        with:
          repository: highemerly/movapic-fonts
          token: ${{ secrets.FONT_REPO_TOKEN }}
          path: fonts
          # 既定(true)だとトークンが fonts/.git/config に残り、COPY で公開イメージへ混入する
          # （v1.4.12 以前のイメージで実際に漏洩した）。checkout 後に git 操作はしないので不要。
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 入力は `${{ }}` で run: に直接埋めない（シェルの文字列として解釈され、
      # 値に `"` や `$(...)` があればそのまま実行される）。環境変数で渡す
      - name: Extract version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for migration changes
        id: migration
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV_TAG" ]; then
            if git diff --name-only "$PREV_TAG" HEAD | grep -q "^prisma/migrations/"; then
              echo "has_migration=true" >> "$GITHUB_OUTPUT"
              echo "Migration files changed since $PREV_TAG"
            else
              echo "has_migration=false" >> "$GITHUB_OUTPUT"
              echo "No migration changes since $PREV_TAG"
            fi
          else
            echo "has_migration=false" >> "$GITHUB_OUTPUT"
            echo "No previous tag found"
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # BuildKit の --mount=type=cache（.next/cache・npm）は type=gha では永続化されないため、
      # actions/cache 経由でラウンドトリップさせて Next.js のビルドを差分化する
      - name: Restore build cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "var-cache-npm": "/root/.npm",
              "var-cache-next": "/app/.next/cache"
            }
          skip-extraction: false

      - name: Build and push Docker image (production)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,compression-level=3
          platforms: linux/amd64

  # GitHub Release をタグごと（パッチも含む）に作る。全検査が通ったときだけ＝Release がある版はデプロイしてよい版。
  # ノートは GitHub の自動生成（前回のタグからマージされた PR の一覧・英語。分類は .github/release.yml）。
  # 同じノートを create-k8s-pr が k8sg1 の PR 本文に使う（変更の一覧の出どころを1つにする）。
  release:
    needs: [build-and-push, checks, golden, e2e]
    runs-on: ubuntu-latest
    permissions:
      # generate-notes API も Release の作成も contents: write が要る
      contents: write
    outputs:
      notes: ${{ steps.notes.outputs.notes }}

    steps:
      # 前回のタグは明示する。省くと GitHub は前回の「Release」を起点にするが、
      # v1.5.3 以前は Release をマイナーごとにしか作っていない。
      # workflow_dispatch（作り直し）でタグが無いときは target_commitish の時点で生成される。
      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
          PREV_TAG: ${{ needs.build-and-push.outputs.prev_tag }}
        run: |
          args=(-f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA")
          if [ -n "$PREV_TAG" ]; then args+=(-f previous_tag_name="$PREV_TAG"); fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/notes.md"
          {
            echo "notes<<NOTES_EOF"
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # 作り直し（workflow_dispatch）では Release は作らない（タグが無い・既にある）
      - name: Create release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  create-k8s-pr:
    # ビルド・CI・ゴールデン画像テスト・E2E が全て成功したときだけ k8s マニフェストへ PR する（release が
    # 同じ条件で待っているので、それを待てば足りる）。k8sg1 は Flux 同期なので、この PR のマージが
    # そのまま本番へのデプロイになる。
    needs: [build-and-push, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout k8s repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.K8S_REPO }}
          token: ${{ secrets.K8SG1_PAT }}
          path: k8s-repo

      # マニフェストの書式が変わって sed が何も書き換えないと、差分が無いので create-pull-request は
      # PR を作らずに黙って成功する（＝デプロイされないのに緑）。書き換わったことを確かめて落とす
      - name: Update image tag
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        working-directory: k8s-repo
        run: |
          repo="${IMAGE%:*}"
          for p in $K8S_MANIFEST_PATHS; do
            sed -i "s|image: ${repo}:.*|image: ${IMAGE}|" "$p"
            grep -q "image: ${IMAGE}$" "$p" || { echo "::error file=$p::image line not updated"; exit 1; }
          done

      # 本文は英語・全アプリ共通の書式（イメージ・ビルドのリンク・release ジョブが生成したノート）。
      # ノートの PR は完全な URL で書かれるので、k8sg1 の #N へのリンクに化けない。
      # マイグレーションの節だけはこのリポジトリ固有（共有 Postgres に port-forward して手元から当てる。
      # 当てるのはマージ＝イメージ差し替えの前）。
      - name: Write PR body
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          NOTES: ${{ needs.release.outputs.notes }}
          HAS_MIGRATION: ${{ needs.build-and-push.outputs.has_migration }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "- Image: \`$IMAGE\`"
            echo "- Build: $RUN_URL"
            echo
            printf '%s\n' "$NOTES"
            if [ "$HAS_MIGRATION" = "true" ]; then
              echo
              # heredoc の中身と終端は `{` と同じ字下げに置く（YAML が字下げを外すと終端が行頭に来る）
              cat <<'MIGRATION'
          > [!WARNING]
          > This release includes DB migrations. Apply them before merging.

          ```bash
          kubectl port-forward -n shared-postgres-prd svc/postgres-rw 15432:5432
          DATABASE_URL="postgresql://<username>:<password>@localhost:15432/movapic?sslmode=disable&schema=public" npx prisma migrate status
          DATABASE_URL="postgresql://<username>:<password>@localhost:15432/movapic?sslmode=disable&schema=public" npx prisma migrate deploy
          ```
          MIGRATION
            fi
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          path: k8s-repo
          token: ${{ secrets.K8SG1_PAT }}
          branch: update-movapic-neo-${{ needs.build-and-push.outputs.version }}
          delete-branch: true
          # マニフェストのリポジトリには PR が大量に来るので、自分に assign して「Assigned to you」で見落とさないようにする
          assignees: ${{ github.repository_owner }}
          commit-message: Update movapic-neo to ${{ needs.build-and-push.outputs.version }}
          title: Update movapic-neo to ${{ needs.build-and-push.outputs.version }}
          body-path: ${{ runner.temp }}/pr-body.md
          # app-update: k8sg1 に大量に来る PR のうちアプリの版上げを見分ける（全アプリ共通）。
          # アプリ名はタイトルにあるのでアプリ別のラベルは付けない
          labels: |
            app-update
            ${{ needs.build-and-push.outputs.has_migration == 'true' && 'requires-migration' || '' }}

name: E2E

# E2E スモークテストの再利用可能ワークフロー。ci.yml（ブランチ push・差分で必要なときだけ）と
# docker-build.yml（タグ push・push 済みの本番イメージで）から呼ぶ。
# 本番イメージ（runner ステージ）を build し（push はしない）、e2e/compose.yml で Postgres・S3 互換
# （versitygw）・偽 Fediverse サーバーと一緒に起動して Playwright を回す。主要ページが開けるか
# （CSP の nonce を含む）、本番イメージでのプレビュー生成（HEIC デコード・skia 描画・compute 呼び出し）、
# Mastodon / Misskey へのログインと投稿（変換済み画像・本文・公開範囲が届くか）を見る。
on:
  workflow_call:
    inputs:
      # 指定するとビルドせず、このイメージ（push 済み・public）で回す。タグ時に、デプロイするイメージ
      # そのものを確かめるため（作り直したイメージで通っても、本番に出すものの確認にならない）。
      image:
        type: string
        default: ''
    secrets:
      FONT_REPO_TOKEN:
        required: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 普段はビルド込みで4〜6分。どこかで止まったときに既定の6時間待たず、すぐ赤くして気づけるようにする
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # e2e/compose.yml の app が使うイメージ
      E2E_IMAGE: ${{ inputs.image || 'movapic-neo:e2e' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout fonts (private repository)
        if: ${{ !inputs.image }}
        uses: actions/checkout@v7
        with:
          repository: highemerly/movapic-fonts
          token: ${{ secrets.FONT_REPO_TOKEN }}
          path: fonts
          # 既定(true)だとトークンが fonts/.git/config に残り、COPY でイメージへ混入する
          # （v1.4.12 以前のイメージで実際に漏洩した）。checkout 後に git 操作はしないので不要。
          persist-credentials: false

      - name: Set up Docker Buildx
        if: ${{ !inputs.image }}
        uses: docker/setup-buildx-action@v4

      # タグ時の build-and-push が積む buildcache を再利用する（lockfile が同じなら deps の
      # sharp ソースビルドはスキップされ、実質 next build だけになる）。
      - name: Build production image
        if: ${{ !inputs.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          tags: movapic-neo:e2e
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          platforms: linux/amd64

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Playwright と prisma CLI（マイグレーション用）を使うだけなので、ネイティブビルドは不要。
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # --with-deps は付けない。ランナーに足りないのはフォント（fonts-ipafont-gothic など9個）だけで、
      # その apt のダウンロードがミラー次第で数分〜止まったままになった（2026-11 に繰り返し発生）。
      # スモークは見た目を比べない（スクリーンショットなし）のでフォントは要らない。
      # headless でしか動かさないので、本体ではなく headless shell だけを入れる（小さい）。
      - name: Install Playwright browser
        run: npx playwright install --only-shell chromium

      - name: Generate certificates for fake Fediverse servers
        run: e2e/fakeverse/gen-certs.sh

      - name: Start database, S3 and fake Fediverse servers
        run: docker compose -f e2e/compose.yml up -d --wait db s3 fakeverse

      - name: Migrate database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:55432/movapic

      - name: Start app
        run: docker compose -f e2e/compose.yml up -d --wait app

      - name: Run E2E smoke tests
        run: npx playwright test -c e2e/playwright.config.ts

      # 失敗時のみ、Playwright のレポート（trace 付き）とアプリのログを残す。
      - name: Collect app logs on failure
        if: failure()
        run: docker compose -f e2e/compose.yml logs app fakeverse s3 > e2e/app.log 2>&1 || true

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/app.log
          if-no-files-found: ignore

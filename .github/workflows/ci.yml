name: CI

# テストゲート。全ブランチへの push で checks.yml（vitest / eslint / tsc）・
# golden.yml（ゴールデン画像テスト）・e2e.yml（本番イメージを起動してのスモーク）を回す。
# checks と golden は main の ruleset の必須チェック。
# タグ push（リリース）は branches フィルタに一致しないためここでは発動せず、
# docker-build.yml 側が checks と golden をビルドと並走させる（＝二重実行しない）。
# 本番イメージの push はタグ時だけ（e2e は build して手元の docker に load するだけ）。
on:
  push:
    branches:
      - '**'

# 同一ブランチ/PR の古い実行はキャンセルして CI 分を節約する。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # 必須チェックにするため paths で絞らない（スキップされると結果が付かず PR がマージできなくなる）。
  golden:
    uses: ./.github/workflows/golden.yml
    secrets:
      FONT_REPO_TOKEN: ${{ secrets.FONT_REPO_TOKEN }}

  # 本番イメージを起動してのスモークテスト。本番イメージの build（push なし）を含む。
  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets:
      FONT_REPO_TOKEN: ${{ secrets.FONT_REPO_TOKEN }}
